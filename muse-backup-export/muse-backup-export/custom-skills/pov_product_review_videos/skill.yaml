  rationale: The same POV template was corrected repeatedly in one day. The first video was 10 seconds not 20 seconds, the assistant guessed the videos had no voiceover when they had spoken review, the charger changed structure after 10 seconds and its battery did not fit snugly or touch the top contact, and the 2.2kg detergent packs looked too small. A second segment also failed and left a video at 10 seconds. Skill search found no POV product review skill, only avatar dance videos and podcast generation, and the Runway connector covers generation mechanics not this template, so a new reusable skill is the fix. The deterministic candidate about memory handoff suppression is a trigger cadence matter, not a reusable skill, so this proposal does not address it.
